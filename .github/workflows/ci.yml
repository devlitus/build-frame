# El despliegue (Vercel) se añadirá al llegar al MVP (M7), ver ADR 0005.
name: CI

on:
  push:
    branches: [main, 'hito/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # En las PR (hacia el hito y hacia main) y en main.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Solo la tanda de humo: la completa corre en local antes de cada hito (PROCESO §5).
      - run: npm run e2e:humo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
